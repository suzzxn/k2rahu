<div id="ui-header" style="position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; z-index: 10; border-left: 4px solid #00ff88;">
    <h2 style="margin:0; font-size: 1.1em; letter-spacing: 1px;">REAL-TIME CELESTIAL ENGINE</h2>
    <p style="opacity: 0.7; font-size: 0.75em; margin: 5px 0 0 0;">
        MODE: LIVE EPHEMERIS SYNC<br>
        DATA: GEOCENTRIC ECLIPTIC<br>
        NODES: DYNAMIC RETROGRADE
    </p>
</div>

<div id="telemetry-footer" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #4facfe; pointer-events: none; background: rgba(0,0,0,0.6); padding: 8px 25px; border-radius: 50px; font-family: 'Courier New', Courier, monospace; z-index: 10; border: 1px solid rgba(79, 172, 254, 0.3); white-space: nowrap; font-size: 0.9em; letter-spacing: 1px; text-shadow: 0 0 10px rgba(79, 172, 254, 0.5);">
    <span id="live-data">SYNCING WITH SATELLITE...</span>
</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- 1. CORE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 8, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);
    
    document.body.style.margin = '0';
    document.body.style.overflow = 'hidden';
    document.body.style.backgroundColor = '#000';

    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');

    // --- 2. ASSETS ---
    const assets = {
        earthDay: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/earth_atmos_2048.jpg',
        earthNight: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/earth_lights_2048.png',
        moon: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/moon_1024.jpg'
    };

    // --- 3. CELESTIAL CALCULATIONS (Real-Time Math) ---
    function getJulianDate(date) {
        return (date.getTime() / 86400000) - (date.getTimezoneOffset() / 1440) + 2440587.5;
    }

    function calcEphemeris() {
        const now = new Date();
        const d = getJulianDate(now) - 2451545.0; // Days since J2000

        // 1. Rahu (Mean Ascending Node Longitude)
        // Omega = 125.044522 - 0.0529537648 * d
        let rahuLong = (125.044522 - (0.0529537648 * d)) % 360;
        if (rahuLong < 0) rahuLong += 360;

        // 2. Moon (Mean Longitude)
        // L = 218.3164477 + 13.17639648 * d
        let moonLong = (218.3164477 + (13.17639648 * d)) % 360;
        if (moonLong < 0) moonLong += 360;

        // 3. Earth Rotation (GST approximation)
        let gst = (18.697374558 + 24.06570982441908 * d) % 24;
        let earthRot = (gst / 24) * Math.PI * 2;

        return { rahuLong, moonLong, earthRot };
    }

    // --- 4. OBJECT CONSTRUCTION ---
    const orbitRadius = 8;
    
    // Earth
    const earthGroup = new THREE.Group();
    earthGroup.rotation.z = THREE.MathUtils.degToRad(23.44);
    scene.add(earthGroup);

    const earth = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshStandardMaterial({
            map: loader.load(assets.earthDay),
            emissiveMap: loader.load(assets.earthNight),
            emissive: new THREE.Color(0xffffaa),
            emissiveIntensity: 0.7,
            roughness: 0.8
        })
    );
    earthGroup.add(earth);

    // Moon Orbit (White, tilted 5.14°)
    const moonOrbitGroup = new THREE.Group();
    moonOrbitGroup.rotation.x = THREE.MathUtils.degToRad(5.14);
    scene.add(moonOrbitGroup);

    const moon = new THREE.Mesh(
        new THREE.SphereGeometry(0.27, 32, 32),
        new THREE.MeshStandardMaterial({ map: loader.load(assets.moon), roughness: 1 })
    );
    moonOrbitGroup.add(moon);

    // Ecliptic Path (Blue, Horizontal)
    const points = [];
    for (let i = 0; i <= 128; i++) {
        const angle = (i / 128) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(angle) * orbitRadius, 0, Math.sin(angle) * orbitRadius));
    }
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0x4444ff, transparent: true, opacity: 0.4 })));
    moonOrbitGroup.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })));

    // Rahu & Ketu (Glowing Shadows)
    const rahu = new THREE.Mesh(new THREE.SphereGeometry(0.27, 32, 32), new THREE.MeshStandardMaterial({ color: 0x001100, emissive: 0x003300, emissiveIntensity: 2, transparent: true, opacity: 0.8 }));
    scene.add(rahu);

    const ketu = new THREE.Mesh(new THREE.SphereGeometry(0.27, 32, 32), new THREE.MeshStandardMaterial({ color: 0x110000, emissive: 0x330000, emissiveIntensity: 2, transparent: true, opacity: 0.8 }));
    scene.add(ketu);

    // --- 5. ENVIRONMENT ---
    const sun = new THREE.DirectionalLight(0xffffff, 3.5);
    sun.position.set(-15, 5, 10);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xffffff, 0.05));

    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for(let i=0; i<8000; i++) starPos.push((Math.random()-0.5)*500, (Math.random()-0.5)*500, (Math.random()-0.5)*500);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.12})));

    // --- 6. DATA UI LOGIC ---
    const displayEl = document.getElementById('live-data');
    let userCity = "Kathmandu";
    let userCountry = "Nepal";

    async function fetchLocation() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            if (data.city) { userCity = data.city; userCountry = data.country_name; }
        } catch (e) {}
    }

    function updatePositions() {
        const eph = calcEphemeris();
        const now = new Date();

        // Sync Earth rotation
        earth.rotation.y = eph.earthRot;

        // Sync Moon (Degrees to Radians)
        const mAngle = THREE.MathUtils.degToRad(eph.moonLong);
        moon.position.set(Math.cos(mAngle) * orbitRadius, 0, Math.sin(mAngle) * orbitRadius);

        // Sync Nodes (Degrees to Radians)
        const rAngle = THREE.MathUtils.degToRad(eph.rahuLong);
        rahu.position.set(Math.cos(rAngle) * orbitRadius, 0, Math.sin(rAngle) * orbitRadius);
        
        const kAngle = rAngle + Math.PI; // Ketu is always 180 deg opposite
        ketu.position.set(Math.cos(kAngle) * orbitRadius, 0, Math.sin(kAngle) * orbitRadius);

        // Update UI
        const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
        const offset = -now.getTimezoneOffset();
        const gmtStr = `GMT ${Math.floor(offset/60)} ${Math.abs(offset%60).toString().padStart(2, '0')}`;
        displayEl.innerText = `${userCity}, ${userCountry} ${timeStr}, ${gmtStr}`;
    }

    fetchLocation();
    
    // --- 7. ANIMATION ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    function animate() {
        requestAnimationFrame(animate);
        updatePositions(); // Run real-time sync every frame
        
        const pulse = (Math.sin(Date.now() * 0.002) + 1) / 2;
        rahu.material.emissiveIntensity = 0.5 + (pulse * 2);
        ketu.material.emissiveIntensity = 0.5 + (pulse * 2);
        
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
